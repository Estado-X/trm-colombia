name: Actualizar datos

# Corre a mano desde la pestaña Actions (workflow_dispatch) y, una vez prendida,
# todos los días a las 10:00 p. m. de Bogotá (03:00 UTC). La Superintendencia Financiera
# calcula en la tarde de cada día hábil la TRM que rige desde el día siguiente, y el
# conjunto de datos.gov.co se actualiza hacia las 6:00 p. m. de Bogotá: a las 10:00 p. m.
# ya está publicada y la página amanece con la TRM del día.
# LANZAMIENTO: para prender la actualización diaria, quitar "# " al inicio de las dos líneas de schedule.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Bajar la TRM de datos.gov.co
        run: python scripts/actualizar_datos.py
      - name: Guardar los datos nuevos
        # Se sube solo si cambió la TRM (data/trm.json) o si cambiaron los errores de la corrida.
        # Si la fuente falla, el script conserva los datos anteriores, anota el error y no deja la corrida en rojo.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          errores_cambiaron() {
            python - <<'PY'
          import json, subprocess, sys
          nuevo = json.load(open("data/corrida.json", encoding="utf-8")).get("errores")
          r = subprocess.run(["git", "show", "HEAD:data/corrida.json"], capture_output=True, text=True)
          viejo = json.loads(r.stdout).get("errores") if r.returncode == 0 and r.stdout else None
          sys.exit(0 if nuevo != viejo else 1)
          PY
          }
          if ! git diff --quiet -- data/trm.json || errores_cambiaron; then
            git add data/trm.json data/corrida.json
            git commit -m "Datos del $(date -u +%Y-%m-%d)"
            git push
          else
            echo "Sin cambios en la TRM."
          fi
